<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<style>
.rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
.sub{animation:fade 1s .9s both}.hud{animation:fade 1s 1.4s both}
.g1{animation:g1 4s steps(1) infinite}.g2{animation:g2 4s steps(1) infinite}
.blink{animation:blink 1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes g1{0%,86%,100%{opacity:0;transform:none}87%{opacity:.85;transform:translate(-5px,2px)}89%{opacity:.85;transform:translate(4px,-2px)}91%{opacity:.85;transform:translate(-2px,1px)}93%{opacity:0}}
